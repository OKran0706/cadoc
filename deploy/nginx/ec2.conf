# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Single public HTTPS port: Platform UI/API, agent installer + downloads, and the
# Sentinel ingestion gateway (routed by path). mTLS is requested but optional so
# browsers are unaffected; ingestion locations enforce it individually.
server {
    listen 443 ssl;
    server_name _;

    # Server certificate: signed by the Canary CA with SAN for the public host/IP
    # (generated by deploy/ec2-setup.sh).
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Client cert verification against the Canary CA (Vault PKI root).
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;

    # Re-resolve upstream names via Docker DNS so recreating a container (new IP) does not
    # leave nginx proxying to a stale address (502). Variables force per-request resolution.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $ingestion_upstream http://ingestion-service:8443;
    set $platform_upstream http://platform-service:8000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # ------------------------------------------------------------------
    # Sentinel agent installer + release artifacts (static, public)
    # ------------------------------------------------------------------
    location = /install.sh {
        alias /usr/share/nginx/downloads/install-sentinel.sh;
        default_type text/x-shellscript;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        default_type application/octet-stream;
        autoindex off;
    }

    # ------------------------------------------------------------------
    # Sentinel ingestion gateway. Identity headers are ALWAYS overwritten from
    # the verified TLS session; client-supplied values are never forwarded.
    # NOTE: ingestion's own /bootstrap/join is intentionally NOT routed. Join tokens
    # are minted by platform-service (/api/v1/bootstrap/join) after JWT + tenant checks.
    # ------------------------------------------------------------------

    # mTLS required
    location ~ ^/(ingest|control/killswitch|bootstrap/maintenance_key)$ {
        if ($ssl_client_verify != SUCCESS) { return 401; }

        proxy_pass $ingestion_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-CN "";
    }

    # Join-token authenticated (agent has no client cert yet)
    location = /bootstrap/get_credentials {
        proxy_pass $ingestion_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Client-Cert-DN "";
        proxy_set_header X-Client-Cert-CN "";
    }

    # Renewal-token authenticated. The agent holds no private key in memory at
    # this point and asserts its identity via X-Client-Cert-CN, so that header is
    # the only client-supplied identity header allowed through.
    location = /bootstrap/renew_credentials {
        proxy_pass $ingestion_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Client-Cert-DN "";
    }

    # Health check endpoints
    location /health {
        proxy_pass $platform_upstream/health;
    }

    # Platform Service Web App and Management API
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;

        proxy_pass $platform_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
