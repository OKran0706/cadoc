# Banking payments server: SWIFT gateway, payment switch, ledger backups, HSM keys, clearing creds.
# Leaf directories only: audit watches are per directory, not recursive.
profile: bfsi-payments
target_directories:
  - path: /opt/bank/swift
    canary_type: env_file
    count: 2
  - path: /opt/bank/payments
    canary_type: config_backup
    count: 2
  - path: /var/backups/bank
    canary_type: db_dump
    count: 2
  - path: /opt/bank/keys
    canary_type: ssh_key
    count: 1
  - path: /opt/bank/clearing
    canary_type: credentials
    count: 2

naming_strategy: ml
timestamp_strategy: blend
permission_strategy: inherit
