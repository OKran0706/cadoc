# canary-system/config/s3-sink.yaml
# Derived from: telemetry-bus/SKILL.md — Kafka → S3 Consumer (Vector)
# Runs on dedicated archiver node

sources:
  kafka_canary:
    type: kafka
    bootstrap_servers: "kafka-0:9092,kafka-1:9092"
    topics: ["canary-events"]
    group_id: "archive"
    tls:
      enabled: true
      ca_file: /etc/canary/tls/ca.crt
      crt_file: /etc/canary/tls/archiver.crt
      key_file: /etc/canary/tls/archiver.key

sinks:
  s3_immutable:
    type: aws_s3
    inputs: [kafka_canary]
    bucket: canary-logs-immutable
    region: us-east-1
    key_prefix: "events/year=%Y/month=%m/day=%d/hour=%H/"
    encoding:
      codec: ndjson
    compression: gzip
    batch:
      max_bytes: 10485760    # 10MB per file
      timeout_secs: 300      # Flush every 5 minutes

  loki:
    type: loki
    inputs: [kafka_canary]
    endpoint: "https://loki.internal"
    auth:
      strategy: bearer
      token: "${LOKI_WRITE_TOKEN}"
    labels:
      host: "{{ .host }}"
      alert_type: "{{ .type }}"
    encoding:
      codec: json
    tls:
      ca_file: /etc/canary/tls/ca.crt
