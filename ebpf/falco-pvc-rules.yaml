# canary-system/ebpf/falco-pvc-rules.yaml
# Derived from: pvc-watchdog/SKILL.md — Falco Rules for PVC Canary Detection

- list: canary_pvc_paths
  items:
    - "/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*/mount/pg_dump_prod.sql.gz"
    - "/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*/mount/.aws/credentials"
    - "/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*/mount/kubeconfig_backup.yaml"

- rule: Canary File Read on PVC Mount
  desc: A process read a canary file from a mounted PVC
  condition: >
    open_read and
    fd.name pmatch (canary_pvc_paths)
  output: >
    CANARY_PVC_ACCESS
    file=%fd.name
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
    container=%container.name
    image=%container.image.repository
    proc=%proc.name
    user=%user.name
    node=%k8s.node.name
  priority: CRITICAL
  tags: [canary, kubernetes, pvc]

- rule: Bulk PVC File Read (Exfiltration Pattern)
  desc: High volume of file reads from a PVC mount in short window
  condition: >
    open_read and
    fd.name startswith "/var/lib/kubelet/pods/" and
    fd.name contains "/volumes/" and
    evt.count > 100
  output: CANARY_PVC_BULK_READ pod=%k8s.pod.name file=%fd.name
  priority: HIGH
  tags: [canary, kubernetes, exfiltration]
