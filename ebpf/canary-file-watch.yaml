# canary-system/ebpf/canary-file-watch.yaml
# Derived from: file-canary-engine/SKILL.md — Tetragon TracingPolicy
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: canary-file-access
spec:
  kprobes:
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                # Populated dynamically from canary-map.json
                - "/home/deploy/.ssh/id_rsa_backup"
                - "/etc/app/settings_backup.env"
                - "/var/backups/pg_dump_prod_2024.sql.gz"
                - "/opt/app/config/.env.production.bak"
                - "/etc/kubernetes/kubeconfig_backup.yaml"
                - "/root/.aws_credentials.bak"
