# canary-system/docker-compose.yml
# Derived from: telemetry-bus/SKILL.md, deployment/SKILL.md
# Local dev/test environment for the canary detection pipeline

version: "3.9"

services:
  # --- Infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c '
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
        --topic canary-events --partitions 6 --replication-factor 1 \
        --config retention.ms=-1 --config cleanup.policy=delete
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
        --topic canary-heartbeats --partitions 3 --replication-factor 1 \
        --config retention.ms=86400000
      echo "Kafka topics created."
      '

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: canarydb
      POSTGRES_USER: canary_admin
      POSTGRES_PASSWORD: canary_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./src/db_canary/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary_admin -d canarydb"]
      interval: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: canary_dev_password
      MYSQL_DATABASE: canarydb
    ports:
      - "3306:3306"
    command: --general-log=1 --general-log-file=/var/log/mysql/general.log

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- Canary Services ---
  detection-engine:
    build:
      context: .
      dockerfile: Dockerfile.detection
    environment:
      CANARY_KAFKA_BROKERS: "kafka:9092"
      CANARY_DB_CONN: "postgres://canary_admin:canary_dev_password@postgres:5432/canarydb"
      CANARY_PAGERDUTY_KEY: "${CANARY_PAGERDUTY_KEY:-test}"
      CANARY_SLACK_WEBHOOK: "${CANARY_SLACK_WEBHOOK:-http://localhost:9999}"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/opt/canary/config
      - ./src:/opt/canary/src

  db-listener:
    build:
      context: .
      dockerfile: Dockerfile.dblistener
    environment:
      CANARY_DB_CONN: "postgres://canary_admin:canary_dev_password@postgres:5432/canarydb"
      CANARY_KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  chain-verifier:
    build:
      context: .
      dockerfile: Dockerfile.verifier
    environment:
      CANARY_KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
