# canary-system/helm/values.yaml
# Derived from: deployment/SKILL.md + pvc-watchdog/SKILL.md

image:
  repository: internal-registry.io/canary-system
  tag: "1.0.0"
  pullPolicy: IfNotPresent

kafka:
  brokers: "kafka-0.kafka:9092,kafka-1.kafka:9092"

canaryPVC:
  enabled: true
  storageClass: standard
  size: 1Gi
  accessModes:
    - ReadWriteOnce

watchdog:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

detection:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

nodeAgent:
  enabled: true
  image:
    repository: internal-registry.io/canary-node-agent
    tag: "1.0.0"

rbac:
  create: true

serviceAccount:
  create: true
  name: canary-system

networkPolicy:
  enabled: true

tolerations: []
nodeSelector: {}
