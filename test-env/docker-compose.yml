services:
  cert-generator:
    image: alpine:latest
    container_name: canary-cert-generator
    volumes:
      - ./certs:/certs
    working_dir: /certs
    command: >
      sh -c "
      apk add --no-cache openssl &&
      echo 'Generating CA...' &&
      openssl req -new -x509 -keyout ca.key -out ca.crt -days 365 -nodes -subj '/CN=Canary CA' &&
      echo 'Generating Server (Kafka) Certs...' &&
      openssl req -newkey rsa:2048 -nodes -keyout kafka.key -out kafka.csr -subj '/CN=localhost' &&
      openssl x509 -req -in kafka.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out kafka.crt -days 365 &&
      echo 'Generating Client (Sentinel) Certs...' &&
      openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=sentinel-client' &&
      openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365 &&
      echo 'Formatting for Bitnami Kafka (PEM)...' &&
      cat kafka.crt kafka.key > kafka.keystore.pem &&
      cp ca.crt kafka.truststore.pem && chmod -R 777 /certs &&
      echo 'Certificates successfully generated!'
      "

  vault:
    image: hashicorp/vault:latest
    container_name: canary-vault
    entrypoint: ["vault", "server", "-dev"]
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: canary-kafka
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://canary-kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@canary-kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
  webhook:
    build: 
      context: ./webhook
      dockerfile: Dockerfile
    container_name: canary-webhook
    ports:
      - "8080:8080"

  vault-init:
    image: hashicorp/vault:latest
    container_name: canary-vault-init
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      vault:
        condition: service_started
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    volumes:
      - ./certs:/certs
    entrypoint: >
      sh -c "
      echo 'Waiting for vault API...';
      sleep 3;
      echo 'Writing generated certificates into Vault KV...';
      vault kv put secret/canary/kafka ca_cert=@/certs/ca.crt client_cert=@/certs/client.crt client_key=@/certs/client.key;
      echo 'Generating Sentinel test signing key...';
      vault kv put secret/canary/signer private_key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef;
      echo 'Generating Authority test control key...';
      vault kv put secret/canary/control auth_pubkey=0123456789abcdef0123456789abcdef;
      echo 'Vault initialization complete!';
      "

  sentinel-a:
    build:
      context: ../src/sentinel
      dockerfile: Dockerfile
    container_name: canary-sentinel-a
    privileged: true # Required for capability management in bounded kernels, ebpf graceful degradation
    volumes:
      - ./config:/opt/sentinel/config
      - ./deployer-config:/opt/canary/config
      - deployer-output:/opt/canary/deployed
    depends_on:
      vault-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    command: [
      "--config", "/opt/sentinel/config/sentinel.yaml", 
      "--join-token", "root",
      "--deployer-profile", "app-server",
      "--deployer-config", "/opt/canary/config",
      "--deployer-templates", "/opt/sentinel/templates",
      "--deployer-interval", "15",
      "--deployer-max-jitter", "15"
    ]

volumes:
  deployer-output:
