
services:
  cert-generator:
    image: alpine:latest
    container_name: canary-cert-generator
    volumes:
      - ./certs:/certs
    working_dir: /certs
    command: >
      sh -c "
      apk add --no-cache openssl &&
      echo 'Generating CA...' &&
      openssl req -new -x509 -keyout ca.key -out ca.crt -days 365 -nodes -subj '/CN=Canary CA' &&
      echo 'Generating Server (Kafka) Certs...' &&
      openssl req -newkey rsa:2048 -nodes -keyout kafka.key -out kafka.csr -subj '/CN=localhost' &&
      openssl x509 -req -in kafka.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out kafka.crt -days 365 &&
      echo 'Generating Client (Sentinel) Certs...' &&
      openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=sentinel-client' &&
      openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365 &&
      echo 'Formatting for Bitnami Kafka (PEM)...' &&
      cat kafka.crt kafka.key > kafka.keystore.pem &&
      cp ca.crt kafka.truststore.pem && chmod -R 777 /certs &&
      echo 'Certificates successfully generated!'
      "

  vault:
    image: hashicorp/vault:latest
    container_name: canary-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  kafka:
    image: bitnami/kafka:3.6
    container_name: canary-kafka
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,SSL:SSL
      - KAFKA_CFG_LISTENERS=SSL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=SSL://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_TLS_CLIENT_AUTH=required
      - KAFKA_TLS_TYPE=PEM
    volumes:
      - ./certs/kafka.keystore.pem:/opt/bitnami/kafka/config/certs/kafka.keystore.pem:ro
      - ./certs/kafka.truststore.pem:/opt/bitnami/kafka/config/certs/kafka.truststore.pem:ro
      
  webhook:
    build: 
      context: ./webhook
      dockerfile: Dockerfile
    container_name: canary-webhook
    ports:
      - "8080:8080"

  vault-init:
    image: hashicorp/vault:latest
    container_name: canary-vault-init
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      vault:
        condition: service_started
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    volumes:
      - ./certs:/certs
    entrypoint: >
      sh -c "
      echo 'Waiting for vault API...';
      sleep 3;
      echo 'Writing generated certificates into Vault KV...';
      vault kv put secret/canary/kafka ca_cert=@/certs/ca.crt client_cert=@/certs/client.crt client_key=@/certs/client.key;
      echo 'Vault initialization complete!';
      "

  sentinel-a:
    build:
      context: ../src/sentinel
      dockerfile: Dockerfile
    container_name: canary-sentinel-a
    privileged: true # Required for capability management in bounded kernels, ebpf graceful degradation
    volumes:
      - ./config:/opt/sentinel/config
    depends_on:
      vault-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      - VAULT_ADDR=http://vault:8200
    command: ["--config", "/opt/sentinel/config/sentinel.yaml", "--join-token", "root"]
