telemetry:
  vault_ca_cert: "secret/canary/sentinel-a:ca_cert"
  vault_client_cert: "secret/canary/sentinel-a:client_cert"
  vault_client_key: "secret/canary/sentinel-a:client_key"

oob_alert:
  url: http://canary-webhook:8080

watchdog:
  ingestion_url: "https://canary-ingestion-lb:8443/ingest"
  heartbeat_interval_seconds: 10
  alert_threshold_seconds: 30

signing:
  key_source: vault
  vault_path: secret/canary/signer
  vault_field: private_key

maintenance:
  vault_path: secret/canary/control
  vault_field: auth_pubkey
