telemetry:
  kafka_brokers:
    - canary-kafka:9092
  topic: canary-events
  tls: false
  vault_ca_cert: "secret/canary/kafka:ca_cert"
  vault_client_cert: "secret/canary/kafka:client_cert"
  vault_client_key: "secret/canary/kafka:client_key"

oob_alert:
  url: http://canary-webhook:8080

watchdog:
  peer_socket: /run/canary/sentinel.sock
  heartbeat_interval_seconds: 10
  alert_threshold_seconds: 30

signing:
  key_source: vault
  vault_path: secret/canary/signer
  vault_field: private_key

maintenance:
  vault_path: secret/canary/control
  vault_field: auth_pubkey
