version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canarydb}
      POSTGRES_USER: ${POSTGRES_USER:-canary_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_multi_tenant_onboarding.sql:/docker-entrypoint-initdb.d/01-multi_tenant.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canary_admin} -d ${POSTGRES_DB:-canarydb}"]
      interval: 5s
      retries: 10
      timeout: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "E$$x"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 3s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        rpk --brokers redpanda:9092 cluster config set auto_create_topics_enabled true &&
        rpk --brokers redpanda:9092 topic create canary-events -p 3 || true &&
        rpk --brokers redpanda:9092 topic create canary-heartbeats -p 3 || true

  vault:
    image: hashicorp/vault:latest
    restart: unless-stopped
    entrypoint: ["vault", "server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-cadoc_vault_dev_root_token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:latest
    restart: "no"
    user: root
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-cadoc_vault_dev_root_token}
    volumes:
      - ./deploy/scripts/vault-init.sh:/vault-init.sh:ro
      - ./deploy/certs:/certs:ro
    entrypoint: ["sh", "/vault-init.sh"]

  platform-service:
    build:
      context: ./src/platform_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-canary_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-canarydb}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:?JWT Secret required}
      BOOTSTRAP_JWT_SECRET: ${BOOTSTRAP_JWT_SECRET:?Bootstrap Secret required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Internal API token required}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@cadoc.io}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Admin Password required}
      ENABLE_RATE_LIMIT: "true"
      PROJECT_NAME: "Cadoc Platform (AWS EC2)"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://3.89.18.5}
      CA_CERT_PATH: /certs/ca.crt
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_TOPIC: "canary-events"
    volumes:
      - ./deploy/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  ingestion-service:
    build:
      context: ./src/ingestion_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_TOPIC: "canary-events"
      VAULT_ADDR: "http://vault:8200"
      VAULT_ADMIN_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-cadoc_vault_dev_root_token}
      JWT_SECRET: ${JWT_SECRET:?JWT Secret required}
      BOOTSTRAP_JWT_SECRET: ${BOOTSTRAP_JWT_SECRET:?Bootstrap Secret required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Internal API token required}
      PLATFORM_URL: "http://platform-service:8000"
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/certs:/certs:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/ec2.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - platform-service
      - ingestion-service

volumes:
  postgres-data:
  redpanda-data:
